services:
  - type: web
    name: sentinel-x-api
    env: python
    buildCommand: pip install -r dashboard/backend/requirements.txt
    startCommand: gunicorn --chdir dashboard/backend app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: DB_PATH
        value: /opt/render/project/src/sentinel.db
